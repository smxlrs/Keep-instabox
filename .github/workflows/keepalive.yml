name: instabox-keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Renew lease / wake / reset run window
        env:
          IBX_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IBX_MID: m_agq6nsj5xho6kxaavojx57kurq
        run: |
          set -u
          API="https://api.instabox.sh/v1/machines/$IBX_MID"
          AK="X-API-Key"
          AUTH="$AK"': '"$IBX_KEY"
          CT="Content-Type"
          CT="$CT: application/json"
          IK="Idempotency-Key"
          IK="$IK"': '"$(date +%s)-$$-$RANDOM"
          ok=0

          get_state() {
            curl -sS --max-time 20 -H "$AUTH" "$API" 2>/dev/null \
              | jq -r '.state // "unknown"' 2>/dev/null || echo unknown
          }

          # 1) make sure the box is running. A failed reset can leave it
          #    suspended; while it sits there every lease PUT answers 409 and
          #    the old code exited "successfully" without ever recovering it.
          st=$(get_state)
          echo "state=$st"
          if [ "$st" = "suspended" ] || [ "$st" = "stopped" ]; then
            curl -sS --max-time 20 -H "$AUTH" "$API" -o /tmp/m0.json
            cd_until=$(jq -r '.cooldownUntil // empty' /tmp/m0.json)
            cd_ts=$(date -u -d "$cd_until" +%s 2>/dev/null || echo 0)
            if [ -n "$cd_until" ] && [ "$cd_ts" -gt "$(date -u +%s)" ]; then
              echo "max-run cooldown until $cd_until - waiting, next tick retries"
              exit 0
            fi
            ep=resume
            [ "$st" = "stopped" ] && ep=start
            echo "box is $st without an active cooldown -> $ep"
            rcode=$(curl -sS --max-time 30 -o /tmp/op.out -w '%{http_code}' \
              -X POST -H "$AUTH" -H "$CT" -H "$IK" -d '{}' "$API/$ep" || echo 000)
            echo "$ep -> HTTP $rcode $(head -c 200 /tmp/op.out 2>/dev/null)"
            for i in $(seq 1 24); do
              sleep 5
              st=$(get_state)
              [ "$st" = "running" ] && break
            done
            echo "after $ep -> $st"
            if [ "$st" != "running" ]; then
              echo "::error::recovery failed (state=$st)"
              exit 1
            fi
          fi

          # 2) renew the lease: blocks the 30-min idle pause; a lease PUT also
          #    wakes an auto-paused box (step 1 already handled any pause)
          code=$(curl -sS -o /tmp/lease.out -w '%{http_code}' --max-time 30 \
            -X PUT -H "$AUTH" -H "$CT" \
            -d '{"ttlSeconds":3600}' \
            "$API/activity-leases/hermes-keepalive" || echo 000)
          echo "lease -> $code"
          case "$code" in
            200|201)
              ok=1 ;;
            409)
              echo "::warning::lease conflict while running: $(head -c 200 /tmp/lease.out 2>/dev/null)" ;;
            401|403)
              echo "::error::API key invalid or missing machines:write scope"
              exit 1 ;;
            *)
              echo "::warning::lease returned $code: $(head -c 300 /tmp/lease.out 2>/dev/null)" ;;
          esac

          # 3) less than 15 min left in the run window -> suspend+resume to reset it
          #    (avoids the forced pause and the escalating cooldowns)
          curl -sS --max-time 20 -H "$AUTH" "$API" -o /tmp/m.json
          rs=$(jq -r '.runStartedAt // empty' /tmp/m.json)
          mr=$(jq -r '.maxRunMinutes // 0' /tmp/m.json)
          echo "runStartedAt=$rs maxRunMinutes=$mr"
          if [ -n "$rs" ] && [ "$mr" -gt 0 ] 2>/dev/null; then
            rst=$(date -u -d "$rs" +%s 2>/dev/null || echo 0)
            remain=$(( rst + mr * 60 - $(date -u +%s) ))
            echo "remaining=${remain}s"
            if [ "$remain" -lt 900 ]; then
              echo "near cap: suspend -> resume to reset the run window"
              curl -sS --max-time 30 -X POST -H "$AUTH" -H "$CT" -H "$IK" -d '{}' "$API/suspend" -o /dev/null
              for i in $(seq 1 12); do
                sleep 5
                st=$(get_state)
                [ "$st" = "suspended" ] && break
              done
              echo "suspended -> $st"
              # let the suspend operation settle: a resume issued too early is
              # rejected, which left the box frozen until a later tick recovered it
              sleep 15
              st=unknown
              for attempt in 1 2 3; do
                rcode=$(curl -sS --max-time 30 -o /tmp/resume.out -w '%{http_code}' \
                  -X POST -H "$AUTH" -H "$CT" -H "$IK" -d '{}' "$API/resume" || echo 000)
                echo "resume attempt $attempt -> HTTP $rcode $(head -c 200 /tmp/resume.out 2>/dev/null)"
                for i in $(seq 1 6); do
                  sleep 5
                  st=$(get_state)
                  [ "$st" = "running" ] && break
                done
                [ "$st" = "running" ] && break
                sleep 10
              done
              echo "after resume retries -> $st"
              if [ "$st" != "running" ]; then
                echo "::error::not running after reset (state=$st); a later tick recovers it"
                exit 1
              fi
              # lifecycle ops invalidate leases: rebuild immediately
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                -X PUT -H "$AUTH" -H "$CT" \
                -d '{"ttlSeconds":3600}' \
                "$API/activity-leases/hermes-keepalive" || echo 000)
              echo "lease rebuilt -> $code"
              case "$code" in
                200|201) ok=1 ;;
                *) echo "::warning::lease rebuild returned $code" ;;
              esac
            fi
          fi

          if [ "$ok" = 1 ]; then
            echo "OK"
          else
            echo "::error::lease never succeeded"
            exit 1
          fi
