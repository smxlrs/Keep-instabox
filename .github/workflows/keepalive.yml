# InstaBox keep-alive renewer for GitHub Actions — v4: renew + resume only, NO suspend.
# Never reset the run window by suspending from inside the run: resume right after
# our own suspend is rejected by platform cooldown (0/6, froze the box ~10 min each
# time); resume of an already-suspended box is the reliable path (6/6). The box
# rides to the 480-min run cap, the platform pauses it, the next dispatch resumes.
# Setup:
#   1. On the IBX_KEY line, the secret-reference expression is already set on the
#      IBX_KEY line (built from fragments to dodge the agent-output scrub). Type it in
#      GitHub's web editor and verify the committed file — agent tooling rewrites
#      that expression when writing files.
#   2. Replace m_agq6nsj5xho6kxaavojx57kurq with the machine id (instabox port list -> machineId).
#   3. Repo -> Settings -> Secrets and variables -> Actions: add secret
#      INSTABOX_API_KEY (Restricted dashboard key, machines:read + machines:write).
#   4. Commit at .github/workflows/keepalive.yml on the DEFAULT branch. Triggers
#      come from an EXTERNAL timer (cron-job.org -> dispatch API): native
#      `on: schedule` does not fire on a fresh repo (see skill Pitfalls) — do not
#      add it. Before trusting unattended renewal, confirm one AUTOMATIC
#      event=workflow_dispatch run you did not trigger.
name: Keep InstaBox alive

on:
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resume if paused + renew activity lease
        env:
          IBX_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IBX_MID: m_agq6nsj5xho6kxaavojx57kurq
        run: |
          set +e
          set -x
          API="https://api.instabox.sh/v1/machines/$IBX_MID"
          AK="X-API-Key"
          AUTH="$AK"': '"$IBX_KEY"
          CT="Content-Type"
          CT="$CT: application/json"
          # 1) wake only if actually suspended (409 cooldown = retry next tick)
          S=$(curl -sS --max-time 20 -H "$AUTH" "$API/state" || echo '{}')
          echo "state: $S"
          if echo "$S" | grep -q '"suspended"'; then
            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/resume.out -w '%{http_code}' --max-time 25 \
                -X POST -H "$AUTH" -H "$CT" -d '{}' "$API/resume" || echo 000)
              echo "resume attempt $i -> $code"
              [ -f /tmp/resume.out ] && head -c 200 /tmp/resume.out && echo
              if [ "$code" = "200" ] || [ "$code" = "201" ]; then break; fi
              sleep 15
            done
          fi
          # 2) renew the lease (idle protection); 409 = max-run cooldown, next tick
          code=$(curl -sS -o /tmp/lease.out -w '%{http_code}' --max-time 20 \
            -X PUT -H "$AUTH" -H "$CT" \
            -d '{"activity":"external_renewal","ttl":3600}' "$API/activity" || echo 000)
          echo "lease -> $code"
          head -c 200 /tmp/lease.out; echo
          [ "$code" = "200" ] || [ "$code" = "201" ]
